# Surge 直连规则：让本博客不走代理
#
# 背景：本站托管在 Cloudflare（未备案阶段）。如果 Surge 把 blog.guangluo.top
# 交给代理节点，大陆访客会先绕到节点再出口，等于凭空多一跳；而 Cloudflare
# 本身对大陆并不友好，多这一跳只会更慢。
#
# 用法：把下面 [Rule] 段的内容复制进你的 Surge 配置。规则按顺序匹配、命中即停，
# 因此这几条要放在会命中本站的宽泛规则和 FINAL 之前。
#
# 位置建议：紧跟 [Rule] 之后、其它规则集（RULE-SET）与 GEOIP 之前。

[Rule]
# 主域名与所有子域（含 blog.guangluo.top）
DOMAIN-SUFFIX,guangluo.top,DIRECT
# Cloudflare Pages 的部署域名，需要直接访问预览时保留
DOMAIN-SUFFIX,pages.dev,DIRECT

# 说明：
# 1. 只写 blog.guangluo.top 也可以，但一旦以后加 www 或其它子域就会漏，用后缀更稳。
# 2. 若你的配置里已有 GEOIP,CN,DIRECT，请注意顺序：本站在境外,
#    GEOIP 不会命中它，所以放在 GEOIP 前后都有效；但放在 FINAL,PROXY 之前是必须的。
# 3. 作者本地的占位图 CDN 与 MathJax 已在本站构建产物中移除/自托管，
#    故无需为它们单独加规则。

# 验证方式（改完先刷新配置，再逐项确认）：
#   1. 上面三条规则在 Surge 的规则列表里位于 FINAL 之前。
#   2. 用命令行确认解析结果不再是 198.18.x.x 的 fake-IP：
#        dig +short blog.guangluo.top
#      若仍返回 198.18.192.x，说明规则没生效或没被匹配到。
#   3. 在 Surge 的「请求」面板里搜 guangluo.top，查看该请求的 policy 是否为 DIRECT。
#   4. 本站有 canonical 主机校验，从备用域名访问会弹提示；直连后主域名不应再弹。
