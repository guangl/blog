# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 个人摄影学习之路
subtitle: "摄影 · 练习 · 记录"
description: "罗广的摄影学习记录：曝光、构图与后期的练习笔记，以及出门拍到的照片。"
keywords: 摄影, 摄影学习, 曝光, 构图, 后期修图, 摄影笔记
author: 罗广
language: zh-CN
timezone: Asia/Shanghai
avatar: https://blog.guangluo.top/images/avatar.png
favicon: /images/favicon.svg

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.guangluo.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""
marked:
  prependRoot: true
  postAsset: true

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: "posts"
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 随记
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "date"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: stellar

# Atom 订阅由主题在 head 中提供自动发现链接。
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  content: true
  autodiscovery: false
  template: templates/atom.xml

sitemap:
  path: sitemap.xml
  # 自定义模板：自带模板会在首页产出一条重复 URL，见模板里的注释。
  template: templates/sitemap.xml
  tags: true
  categories: true

# 搜索引擎收录
## 站长平台验证与推送。留空的项不会输出对应 meta，也不会发起推送。
## 验证令牌最终出现在页面 HTML 里，属于公开信息，可以提交进仓库。
## 百度搜索资源平台等域名备案后再接：到时应补 baidu-site-verification
## 验证 meta 和「普通收录」推送，方式与这里的 google / bing 一致。
seo:
  # 各站长平台的站点验证令牌，键名对应输出的 meta：
  #   google → google-site-verification（Google Search Console）
  #   bing   → msvalidate.01（Bing Webmaster Tools）
  # 以平台实际给出的验证代码为准，逐条填入 content 的值
  # （Google 会给成 `google-site-verification=xxx` 或 meta 标记，只取 xxx 这一段）。
  verification:
    google: "iuzocvfT1oujoWHTvRDJriu2E1BE2MDPZdVGGYkw5lU"
    bing: ""
  # IndexNow 密钥：构建时生成站点根目录的 <key>.txt，
  # 部署后由 tools/ping-search.mjs 推送给 Bing、Yandex、Seznam、Naver，无需登录站长平台。
  # 密钥本身是公开的（就放在站点上），但改动后要重新推送一次。
  indexnow_key: "5f133956eed7b3d11ff69fd52706426f"

# 大陆备案信息
## 备案号展示在页脚（主题的 footer.content 末尾）。留空则完全不输出，
## 本地开发、海外构建和 Cloudflare Pages 都不受影响。
## 拿到号之后填这里，`bun run verify` 会校验「填了就必须渲染出来」。
beian:
  # ICP 备案号，例如 鄂ICP备2026000000号-1；页脚会链接到工信部备案系统
  icp: ""
  # 公安联网备案号，例如 鄂公网安备42010000000000号；留空则不输出
  police: ""
  # 公安备案号的链接，留空时用全国互联网安全管理服务平台
  police_url: ""

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ""
