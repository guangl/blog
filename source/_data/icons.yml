# 站内自定义图标。主题的图标集在 node_modules/hexo-theme-stellar/_data/icons.yml，
# 这里的同名键会覆盖它，新键则追加（构建期合并成 stellar.data.icons）。
#
# 用法：任何接受 `icon:` 的地方写 `default:camera`（见 _config.stellar.yml 的顶栏菜单）。
# 主题自带的 34 个图标里没有相机 / 图片，所以这里补一个：自己画的描边相机，
# 线条粗细与风格对齐主题里那枚 `default:search`（stroke-width 1.5、currentColor），
# 不引入第三方图标集的 path 数据。
