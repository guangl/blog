name: "guangluo's blog"
headline: 记录问题，也记录风景。
tagline: 数据库 · 运维 · 生活
description: 一名 DBA 的数据库管理与运维经验，还有镜头里值得留下的日常。
# 右栏仓库卡片（ghrepo）读取这里。
source:
  repository: guangl/blog
# 让首页使用 Wiki 内容页布局：左栏文档树、右栏目录，顶部显示面包屑。
# 集合内只有首页、关于和订阅三个页面，因此 route.path 为 /；
# 文档树的条目使用相对站点根的源路径。
route:
  path: /
navigation:
  tree:
    从这里开始:
      - /index.html
    站内导航:
      - about/
      - subscribe/
hero:
  enabled: true
  background:
    image: /2026/09/13/hankou-river-beach/preview.jpg
    parallax: 0.2
  # 与官方文档站首页一致：Hero 右侧放一个可复制的本地运行命令块。
  preview:
    type: terminal
    commands:
      - label: Hexo
        codes: |
          npm install -g hexo-cli
          hexo server
      - label: Bun
        codes: |
          bun install
          bun run server
  actions:
    - title: 文章归档
      url: /archives/
      icon: default:calendar
    - title: 订阅更新
      url: /subscribe/
      icon: default:rss
leftbar:
  brand:
    source: site
  # 主导航在顶部栏，这里交给文档树。
  widgets: [tree, related]
rightbar:
  widgets: [ghrepo, toc]
breadcrumb: true
footer:
  license: false
  share: []
comments:
  enabled: false
