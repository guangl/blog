name: "个人摄影学习之路"
headline: 把每一次快门都当作练习。
tagline: 摄影 · 练习 · 记录
description: 记录摄影练习的过程，也整理家庭网络搭建和日常使用中的实践。
# 右栏仓库卡片（ghrepo）读取这里。
source:
  repository: guangl/blog
# 让首页使用 Wiki 内容页布局：左栏文档树、右栏目录，顶部显示面包屑。
# 集合内只有首页、关于和订阅三个页面，因此 route.path 为 /；
# 文档树的条目使用相对站点根的源路径。
route:
  path: /
navigation:
  tree:
    从这里开始:
      - /index.html
    站内导航:
      - about/
      - subscribe/
# 首页 Hero：**关闭**（2026-10-17 起）。首页直接从正文开始「关于这个小站」。
# 原来的 Hero 是首页唯一的首屏大图：1600px 档 62 KB，`sizes: 100vw` 让手机也得下它，
# 而且它只是张装饰图，没有信息量。主题的 wiki_cover.ejs 在 `enabled: false` 时
# 整个 cover 都不渲染（连 640px 的容器都不输出），所以不需要额外补 CSS。
# 想加回来：enabled 改 true，再在 hero 下写 background.image（parallax 一并写），
# 并到 _config.stellar.yml 的 inject.head_end 里恢复白色文字的对比度修正。
hero:
  enabled: false
  # 右侧原来是「Hexo / Bun」本地运行命令块，按需求去掉：
  # 不写 preview 时主题会走 without-preview 布局。
  actions:
    - title: 文章归档
      url: /archives/
      icon: default:calendar
    - title: 订阅更新
      url: /subscribe/
      icon: default:rss
leftbar:
  brand:
    source: site
  # 主导航在顶部栏，这里交给文档树。
  widgets: [tree, related]
rightbar:
  widgets: [ghrepo, toc]
breadcrumb: true
footer:
  license: false
  share: []
comments:
  enabled: false
