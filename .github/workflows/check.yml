name: Check blog

on:
  pull_request:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: node --test tools/dnspod-validation.test.mjs
      - run: bun run verify
      - run: bun run verify:domain
