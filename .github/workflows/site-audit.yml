name: Site audit

# 线上站点定时体检：可用性、安全响应头、TLS 证书到期、外链死链。
# 只读线上，什么都不改。体检逻辑全在 tools/audit-live.mjs 里，只用 Node 标准库，
# 所以不需要 bun install（checkout 是必须的：脚本要从 scripts/cloudflare-headers.js
# 现读安全响应头的期望值，不在这里抄字符串）。
#
# 与发布流程完全解耦：deploy-cloudflare.yml / deploy-server.yml 不依赖这个工作流，
# 它红了也不会拦住发布；反过来发布失败也不影响体检。它红了只说明该有人来看一眼。
#
# 红绿语义跟脚本退出码一致：有失败（页面不是 200 / 安全头不符 / 证书将过期 / 外链 404、410）
# 退出码 1，这一步就红；只有告警（外站拦脚本客户端、证书检查因网络不通被跳过）退出码 0，这一步是绿的。
# 所以这里刻意不加 continue-on-error，也不做「失败也绿」的包装。
#
# 时间：cron 用 UTC。每周一 01:00 UTC = 每周一 09:00 北京时间（CST = UTC+8）。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit the live site
        run: node tools/audit-live.mjs
