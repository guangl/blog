# Stellar 2.0 配置；仅覆盖本站使用的选项。
# 主要导航与站内搜索移到顶部栏，左侧栏留给内容本身，与官方文档站的布局一致。
topbar:
  enabled: true
  brand:
    image:
      src: /images/avatar.png
      variant: icon
    name: "个人摄影学习之路"
    tagline: "摄影 · 练习 · 记录"
    href: /
  menu:
    - id: post
      icon: default:documents
      title: 文章
      url: /posts/
    - id: gallery
      icon: default:camera
      title: 相册
      url: /gallery/
    - id: archives
      icon: default:calendar
      title: 归档
      url: /archives/
    - id: about
      icon: default:profile
      title: 关于
      url: /about/
    - id: subscribe
      icon: default:rss
      title: 订阅
      url: /subscribe/
  widgets:
    - spacer
    - menu
    - settings

leftbar:
  brand:
    image:
      src: /images/avatar.png
      variant: icon
    name: "个人摄影学习之路"
    tagline: "摄影 · 练习 · 记录"
    href: /
    search: true
  # 导航已在顶部栏，左侧栏不再重复；Wiki 页面会用文档树替换这里的内容。
  menu: []
  footer:
    actions:
      - type: link
        icon: default:github
        title: GitHub
        url: https://github.com/guangl
      - type: link
        icon: default:rss
        title: Atom 订阅
        url: /atom.xml
      - type: spacer
      - type: dropdown
        icon: default:theme
        title: 外观
        items:
          - type: button
            title: 跟随系统
            onclick: "setColorScheme('auto')"
          - type: button
            title: 浅色
            onclick: "setColorScheme('light')"
          - type: button
            title: 深色
            onclick: "setColorScheme('dark')"

profiles:
  home:
    leftbar:
      widgets: [welcome, recent, tagcloud]
    rightbar:
      widgets: [explore]
  blog_index:
    path: /posts/
    leftbar:
      widgets: [welcome, recent, tagcloud]
    rightbar:
      widgets: [explore]
  post:
    leftbar:
      widgets: [welcome, recent]
    rightbar:
      widgets: [toc]
  page:
    leftbar:
      widgets: [welcome, recent]
    rightbar:
      widgets: [toc]
  # Wiki 文档页：左栏固定菜单让位给文档树，右栏保留目录。
  # 右栏的仓库卡片（ghrepo）由集合数据提供，这里只保留目录。
  wiki:
    leftbar:
      menu: []
      widgets: [tree, related]
    rightbar:
      widgets: [toc]
  # 专栏（topic）与笔记本（notebooks）两套栏目已随内容一起移除（2026-10-17）：
  # 站点只保留摄影内容，_posts/ 与归档、分类、标签足够承载。
  # 需要时按 Stellar 官方文档把这两段配置和对应的 _data 文件加回来即可。
  wiki_index:
    path: null
    rightbar:
      widgets: [toc]
  error:
    image: /images/404.svg

article:
  listing:
    card_layout: classic
    show_tags: true
  show_reading_time: true
  footer:
    share: [email]
    license: "本文采用 [CC BY 4.0 署名国际许可协议](https://creativecommons.org/licenses/by/4.0/)。转载或改编时请注明作者罗广，并附上原文和许可证链接。"

search:
  provider: local
  local:
    scope: all
    include_content: true
    cache_ttl_seconds: 3600

canonical:
  # 主站主机名（裸主机名）：页面的 <link rel="canonical"> 由它生成。
  host: blog.guangluo.top
  # 备用主机名单。注意：主题的「非法克隆站 / 官方备用站」浮层提示已经整体关掉，
  # 见 scripts/canonical-notice.js，所以这里的名单目前只是记录用途，不影响页面行为。
  # 想恢复提示就删掉那个脚本。
  allowed_hosts:
    - guangluo-blog.pages.dev
    - guangluo.top          # 裸域与 www 都归一到这里
    - 82.156.50.189         # 大陆 ECS 公网 IP：备案通过前用 IP 直接访问

# Open Graph / Twitter 卡片。主题默认已开启，这里显式声明，
# 便于日后调整时能看到开关位置。
open_graph:
  enabled: true

structured_data:
  # 告诉搜索引擎这些外部资料属于本站作者，用于知识面板等场景。
  same_as:
    - https://github.com/guangl

footer:
  sitemap:
    - title: 阅读
      items:
        - "[所有文章](/posts/)"
        - "[相册](/gallery/)"
        - "[归档](/archives/)"
    - title: 检索
      items:
        - "[分类](/categories/)"
        - "[标签](/tags/)"
        - "[订阅更新](/subscribe/)"
    - title: 本站
      items:
        - "[关于博客](/about/)"
        - "[GitHub](https://github.com/guangl)"
        - "[站点地图](/sitemap.xml)"
  content: |
    © 2026 [{author.name}](/about/)。文章与图片采用 [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) 许可协议，另有声明的内容除外。
    使用 [Hexo](https://hexo.io/) 与 [{theme.name} {theme.version}]({theme.tree}) 构建。

features:
  color_scheme_switch:
    enabled: true
  reveal:
    enabled: true
    duration: 800
    interval: 200
    distance: 8
    blur: 4
  link_prefetch:
    enabled: false
  card_hover:
    spotlight: true
    tilt: true
  # 数学公式：客户端用 MathJax 排版，仅在页面出现公式时加载。
  math:
    provider: null
  # 图表：客户端用 Mermaid 渲染 ```mermaid 代码块，仅在图表示例页加载。
  diagrams:
    provider: mermaid
    mermaid:
      theme: neutral
  lazy_loading:
    transition: fade
    auto_aspect_ratio: true
  # 主题自带的图片预处理：扫页面里的 <img>，用 sharp 算尺寸与平均色，结果存到
  # source/_data/caches/images_metadata.json。**默认是开的**（主题 _config.yml 里
  # enabled: true），本站要显式关掉——图片已经由 scripts/image-pipeline.js 接管：
  # 尺寸写成 <picture> 里 img 的 width/height，懒加载改用原生 loading，
  # 不再需要「平均色占位图」那套。两者同时开会互相打架：主题在 after_generate
  # 扫产物时遇到本站生成的变体路径（那是磁盘文件、不是 Hexo 路由），
  # 每个变体都会报一条「Local image route not found」并白跑一遍 sharp 分析。
  image_optimization:
    enabled: false

appearance:
  preset: minimal
  color_scheme: auto
  colors:
    primary: "hsl(40 96% 55%)"
    accent: "hsl(24 100% 50%)"
    link: "hsl(166 66% 32%)"
  typography:
    font_family:
      body: '"Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Songti SC", ui-serif, Georgia, "Times New Roman", serif'
      code: 'Monaco, Menlo, Consolas, system-ui, "Courier New", monospace, sans-serif'
  backgrounds:
    leftbar:
      type: gradient

fallbacks:
  avatar: /images/avatar.png
  # 未设置封面的文章在结构化数据、链接卡片等处使用的默认图。
  # 主题默认指向作者 CDN 的占位图，这里换成自己的图（1200×630，适合社交卡片）。
  cover: /images/cover.jpg

# 注入到 </head> 之前的两件事：图标链接 + 首页 Hero 对比度修正。
##
## 图标：主题只在 head 里输出 `<link rel="shortcut icon" href="/images/favicon.svg">`。
## 现代浏览器认这条，但 RSS 阅读器、旧浏览器和第三方工具常直接请求根目录的
## `/favicon.ico`，所以补一条指向多尺寸 .ico 的链接，并给 iOS 书签一个
## apple-touch-icon（180×180，不带透明像素，否则 iOS 会垫成黑底）。
## 两个文件由 `bun run favicon` 从 source/images/favicon.svg 生成，产物提交进仓库。
##
## Hero 对比度：主题只为视频 / 动效英雄加遮罩，图片英雄只有一层「底部渐隐到页面底色」，
## 标题、简介和按钮直接压在照片上。2026-10-17 用无头 Chrome 实测首页（当时有背景图）：
##   修之前：小字（简介、导航、四个按钮）2.56:1，WCAG AA 需要 4.5:1 —— 不达标；
##           大标题 3.6:1，大字门槛 3:1，勉强达标。
##   修之后：全部 6.27:1（主按钮反色后 21:1），浅色与深色外观都达标。
##
## ⚠️ 现状（2026-10-17 晚）：首页 Hero 已经整个关掉了，见 source/_data/wiki/home.yml
## 的 `hero.enabled: false`——首页直接从正文开始，不再有首屏大图。主题在 cover 关闭时
## 连容器都不渲染，所以下面这段目前命中不到任何元素，留着是为了「哪天把图加回来」
## 时不用重新推导一遍。
##
## 把 Hero 加回来时注意两点：
##   1. 遮罩要盖在模糊层（z-index 1）和主题自己的渐隐层（z-index 3）之间，且不破坏
##      「底部渐隐」；取 .30 是「照片还看得清」与「对比度留余量」的折中（.42 能到
##      8:1，但照片发闷）。
##   2. 文字钉白色必须限定成「真的有图片背景」。主题的 adaptive-text 会按图片平均色
##      在白 / 黑之间选色，落到哪一侧取决于照片；而没有图时 Hero 退回
##      `background: var(--background)` + `color: var(--text)`，浅色主题就是白底黑字，
##      再钉白色就成了白底白字。所以下面用 `:has()` 限定。
##
## 遮罩保证的是「那张照片」。换图后要重新量：`node tools/browser-check.mjs /`
## 打印每段 Hero 文字的实测对比度，深色外观加 `--dark`。极端情况把 .30 调大。
## 刻意不写进 check-site：那需要在 CI 里跑无头浏览器，代价大于收益。
inject:
  head_end: |
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      .cover-content.wiki-hero .wiki-cover-background.image::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: rgba(0, 0, 0, .30);
      }
      /* :has() 是必须的：没有图片背景时不能套白色文字，否则浅色主题是白底白字。 */
      .cover-content.wiki-hero:has(.wiki-cover-background.image),
      .cover-content.wiki-hero:has(.wiki-cover-background.image) * {
        --text-banner: #fff !important;
        --text-banner-theme: #fff !important;
      }
    </style>
