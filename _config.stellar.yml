# Stellar 2.0 配置；仅覆盖本站使用的选项。
leftbar:
  brand:
    image:
      src: /images/avatar.svg
      variant: avatar
    name: "guangluo's blog"
    tagline: "数据库 · 运维 · 生活"
    href: /
    search: true
  menu:
    - id: post
      icon: default:documents
      title: 文章
      url: /posts/
    - id: archives
      icon: default:calendar
      title: 归档
      url: /archives/
    - id: about
      icon: default:profile
      title: 关于
      url: /about/
    - id: subscribe
      icon: default:rss
      title: 订阅
      url: /subscribe/
  footer:
    actions:
      - type: link
        icon: default:github
        title: GitHub
        url: https://github.com/guangl
      - type: link
        icon: default:rss
        title: Atom 订阅
        url: /atom.xml
      - type: spacer
      - type: dropdown
        icon: default:theme
        title: 外观
        items:
          - type: button
            title: 跟随系统
            onclick: "setColorScheme('auto')"
          - type: button
            title: 浅色
            onclick: "setColorScheme('light')"
          - type: button
            title: 深色
            onclick: "setColorScheme('dark')"

profiles:
  home:
    leftbar:
      widgets: [welcome, recent, tagcloud]
    rightbar:
      widgets: [explore]
  blog_index:
    path: /posts/
    leftbar:
      widgets: [welcome, recent, tagcloud]
    rightbar:
      widgets: [explore]
  post:
    leftbar:
      widgets: [welcome, recent]
    rightbar:
      widgets: [toc]
  page:
    leftbar:
      widgets: [welcome, recent]
    rightbar:
      widgets: [toc]
  wiki_index:
    path: null
  error:
    image: /images/404.svg

article:
  listing:
    card_layout: classic
    show_tags: true
  show_reading_time: true
  footer:
    share: [email]
    license: "本文采用 [CC BY 4.0 署名国际许可协议](https://creativecommons.org/licenses/by/4.0/)。转载或改编时请注明作者 Guang Luo，并附上原文和许可证链接。"

search:
  provider: local
  local:
    scope: all
    include_content: true
    cache_ttl_seconds: 3600

canonical:
  host: blog.guangluo.top

structured_data:
  same_as:
    - https://github.com/guangl

footer:
  sitemap:
    - title: 阅读
      items:
        - "[所有文章](/posts/)"
        - "[分类](/categories/)"
        - "[标签](/tags/)"
        - "[归档](/archives/)"
    - title: 本站
      items:
        - "[关于博客](/about/)"
        - "[订阅更新](/subscribe/)"
        - "[GitHub](https://github.com/guangl)"
        - "[站点地图](/sitemap.xml)"
  content: |
    © 2026 [{author.name}](/about/)。文章与图片采用 [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) 许可协议，另有声明的内容除外。
    使用 [Hexo](https://hexo.io/) 与 [{theme.name} {theme.version}]({theme.tree}) 构建。

features:
  color_scheme_switch:
    enabled: true
  reveal:
    enabled: false
  link_prefetch:
    enabled: false

appearance:
  preset: glass
  color_scheme: auto
  colors:
    primary: "hsl(40 96% 55%)"
    accent: "hsl(14 100% 57%)"
    link: "hsl(166 66% 32%)"
  typography:
    font_family:
      body: '"Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Songti SC", ui-serif, Georgia, "Times New Roman", serif'
  backgrounds:
    leftbar:
      type: gradient

fallbacks:
  avatar: /images/avatar.svg
